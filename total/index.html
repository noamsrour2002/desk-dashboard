<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0B0D">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Total · PAPER">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache">
  <link rel="apple-touch-icon" href="../icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../icon-32.png">
  <title>Total money · PAPER</title>
  <style>
:root{
  --bg:#0A0B0D;--card:#111317;--ink:#E8EAED;--muted:#7C838F;--line:#22262D;--soft:#181B21;
  --green:#22C55E;--green-bg:rgba(34,197,94,.12);--red:#F05252;--red-bg:rgba(240,82,82,.12);
  --amber:#F5B83D;--amber-bg:rgba(245,184,61,.12);--blue:#60A5FA;--violet:#A78BFA;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"JetBrains Mono","Roboto Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font-family:var(--mono);color:var(--ink);background:var(--bg);font-size:12px;line-height:1.4;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{max-width:820px;margin:0 auto;padding:12px 12px 28px}
a{color:inherit}
.muted{color:var(--muted)}
.pos{color:var(--green)} .neg{color:var(--red)} .flat{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;min-width:0}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#AEB4BE}
.lbl.muted{color:var(--muted);letter-spacing:.06em;text-transform:none}

.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:6px 2px 12px}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:#E8EAED;color:#0A0B0D;display:grid;place-items:center;font-weight:800;font-size:20px;position:relative;flex:0 0 auto}
.logo i{position:absolute;top:6px;left:6px;width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.6s infinite}
.bname{font-weight:800;font-size:15px;letter-spacing:.14em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag-paper{font-size:10px;letter-spacing:.14em;border:1px solid var(--amber);color:var(--amber);border-radius:5px;padding:1px 6px;font-weight:800;background:var(--amber-bg)}
.status{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 2s infinite}
.dot.warn{background:var(--amber)} .dot.off{background:#555;animation:none}
.nav{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.nav a{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#C9CDD3;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--soft);white-space:nowrap}

.big{padding:16px 16px 14px}
.kicker{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.total{font-weight:800;font-size:clamp(38px,13.5vw,64px);line-height:.95;letter-spacing:-.04em}
.total-sol{font-weight:700;font-size:clamp(15px,4.8vw,22px);margin-top:6px;color:#C9CDD3}
.pnl-row{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.pnl-big{font-weight:800;font-size:clamp(20px,6.4vw,28px);letter-spacing:-.03em}
.pnl-pct{font-weight:700;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px}
.glab{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.grid b{font-size:12.5px;display:block}
.fresh{font-size:10px;color:var(--muted);margin-top:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.big.flash-pos{animation:fg .7s ease} .big.flash-neg{animation:fr .7s ease}
@keyframes fg{25%{box-shadow:inset 0 0 0 2px rgba(34,197,94,.45)}}
@keyframes fr{25%{box-shadow:inset 0 0 0 2px rgba(240,82,82,.45)}}

.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft);margin-bottom:10px}
.stack i{display:block;height:100%;transition:width .6s}
.bk{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-top:1px dashed var(--line)}
.bk:first-of-type{border-top:0}
.bk-name{display:flex;gap:8px;align-items:flex-start;min-width:0}
.sw{width:9px;height:9px;border-radius:2px;margin-top:3px;flex:0 0 auto}
.bk-name b{font-size:13px;display:block}
.bk-sub{font-size:10px;color:var(--muted);margin-top:2px}
.bk-val{text-align:right;flex:0 0 auto}
.bk-val b{font-size:14px;display:block}
.bk-val small{font-size:10px;display:block;margin-top:2px}

.eq-wrap{position:relative;height:150px}
.eq-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.eq-meta{font-size:10px;color:var(--muted);margin:-4px 0 8px;min-height:14px}
.tabs{display:flex;gap:4px}
.tabs button{font:inherit;font-size:9px;letter-spacing:.08em;border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:3px 7px;color:#999;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.row{padding:9px 2px;border-top:1px dashed var(--line)}
.row:first-child{border-top:0}
.r-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.r-top b{font-size:13px}
.r-mid{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:#9AA1AC;margin-top:3px;flex-wrap:wrap}
.badge{font-size:8.5px;letter-spacing:.08em;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:#9AA1AC;text-transform:uppercase;margin-left:6px;vertical-align:middle}
.badge.perps{border-color:rgba(96,165,250,.5);color:var(--blue)}
.badge.pump{border-color:rgba(34,197,94,.5);color:var(--green)}
.badge.spot{border-color:rgba(167,139,250,.5);color:var(--violet)}
.badge.stale{border-color:rgba(245,184,61,.5);color:var(--amber)}
.tpsl{font-size:10.5px;margin-top:3px}
.prog{height:4px;background:var(--soft);border-radius:2px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--amber);width:0;transition:width .6s}
.empty{padding:14px 4px;text-align:center;color:var(--muted);font-size:11px}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.foot{text-align:center;color:var(--muted);font-size:10px;margin-top:8px;line-height:1.6}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@keyframes blink{50%{opacity:.25}}
  </style>
</head>
<body>
<main class="app">
  <header class="hero">
    <div class="brand">
      <div class="logo" aria-hidden="true">$<i></i></div>
      <div>
        <div class="bname">TOTAL <span class="tag-paper">PAPER</span></div>
        <div class="status"><span class="dot off" id="dot"></span><span id="st">connecting…</span></div>
      </div>
    </div>
    <nav class="nav">
      <a href="../">← main desk</a>
      <a href="../pump/">pump desk →</a>
    </nav>
  </header>

  <section class="card big" id="big" aria-live="polite">
    <div class="kicker"><span>All paper money · USD</span><span id="tick">—</span></div>
    <div class="total num" id="total">—</div>
    <div class="total-sol num" id="totalSol">—</div>
    <div class="pnl-row">
      <span class="pnl-big num flat" id="pnl">—</span>
      <span class="pnl-pct num flat" id="pnlPct">—</span>
      <span class="muted" style="font-size:10px">since start <span id="startLbl"></span></span>
    </div>
    <div class="grid">
      <div><div class="glab">SOL</div><b class="num" id="mSol">—</b></div>
      <div><div class="glab">BTC</div><b class="num" id="mBtc">—</b></div>
      <div><div class="glab">BTC in SOL</div><b class="num" id="mBtcSol">—</b></div>
      <div><div class="glab">In trades</div><b class="num" id="inTrades">—</b></div>
    </div>
    <div class="fresh" id="fresh">—</div>
  </section>

  <section class="card">
    <div class="chead"><span class="lbl">Where it is</span><span class="lbl muted" id="bkNote"></span></div>
    <div class="stack" id="stack"></div>
    <div id="buckets"></div>
  </section>

  <section class="card">
    <div class="chead"><span class="lbl">Total over time</span>
      <div class="tabs" id="tabs"><button data-r="live" class="on">LIVE</button><button data-r="all">ALL</button></div></div>
    <div class="eq-meta num" id="eqMeta"></div>
    <div class="eq-wrap"><svg id="eq" preserveAspectRatio="none"></svg></div>
  </section>

  <section class="card">
    <div class="chead"><span class="lbl">Pending orders</span><span class="lbl muted" id="pendN"></span></div>
    <div id="pending"></div>
  </section>

  <section class="card">
    <details id="hold">
      <summary class="chead"><span class="lbl">Coins held</span><span class="lbl muted" id="holdN">tap to open</span></summary>
      <div id="coins"></div>
    </details>
  </section>

  <p class="foot" id="foot">PAPER money only · no real funds</p>
</main>
<script>
(function () {
  "use strict";
  var DEX = "https://api.dexscreener.com/tokens/v1/solana/";
  var HL = "https://api.hyperliquid.xyz/info";
  var WSOL = "So11111111111111111111111111111111111111112";
  var QUOTES = { SOL: 1, WSOL: 1, USDC: 1, USDT: 1 };
  var TICK_MS = 1000, DATA_MS = 30000, LS = "total-eq-v1", LS_CAP = 4000;
  var D = null, marks = {}, mids = {}, solSrc = "", lastTotal = null;
  var dexBackoffUntil = 0, dexBackoff = 0, dexOkAt = 0, hlOkAt = 0, hlFails = 0, range = "live";
  var $ = function (id) { return document.getElementById(id); };

  function n(x) { var v = parseFloat(x); return isFinite(v) ? v : null; }
  function usd(v, dp) { if (v == null) return "—"; dp = dp == null ? 2 : dp; var s = Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp }); return (v < 0 ? "−$" : "$") + s; }
  function sgn(v, dp) { if (v == null) return "—"; return (v > 0 ? "+" : v < 0 ? "−" : "±") + usd(Math.abs(v), dp); }
  function pct(v) { return v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(2) + "%"; }
  function cls(v) { return v > 0.004 ? "pos" : v < -0.004 ? "neg" : "flat"; }
  function px(v) { if (v == null) return "—"; if (v >= 1000) return "$" + v.toLocaleString("en-US", { maximumFractionDigits: 0 }); if (v >= 1) return "$" + v.toFixed(2); var d = Math.max(2, -Math.floor(Math.log10(v)) + 2); return "$" + v.toFixed(Math.min(d, 10)); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function hhmmss(t) { return new Date(t).toLocaleTimeString("en-GB", { timeZone: "Europe/Paris", hour12: false }); }

  function timed(url, opts, ms) {
    var c = window.AbortController ? new AbortController() : null;
    var to = setTimeout(function () { if (c) c.abort(); }, ms || 6000);
    opts = opts || {}; opts.cache = "no-store"; if (c) opts.signal = c.signal;
    return fetch(url, opts).then(function (r) { clearTimeout(to); return r; }, function (e) { clearTimeout(to); throw e; });
  }

  function loadData() {
    return timed("data.json?t=" + Date.now(), {}, 8000).then(function (r) { if (!r.ok) throw r.status; return r.json(); })
      .then(function (d) { D = d; if (!Object.keys(marks).length && d.snapshot) { var m = d.snapshot.coin_marks || {}; for (var k in m) marks[k] = m[k]; } render(); })
      .catch(function () {});
  }

  function mints() {
    if (!D) return [];
    var s = {}; (D.pump.coins || []).concat(D.spot.coins || []).forEach(function (c) { s[c.ca] = 1; });
    (D.pending || []).forEach(function (p) { if (p.ca) s[p.ca] = 1; });
    s[WSOL] = 1; return Object.keys(s);
  }

  function pollDex() {
    var now = Date.now(); if (now < dexBackoffUntil) return Promise.resolve();
    var list = mints(); if (!list.length) return Promise.resolve();
    var jobs = [];
    for (var i = 0; i < list.length; i += 30) jobs.push(list.slice(i, i + 30));
    return Promise.all(jobs.map(function (chunk) {
      return timed(DEX + chunk.join(","), {}, 6000).then(function (r) {
        if (r.status === 429) { dexBackoff = Math.min(60000, dexBackoff ? dexBackoff * 2 : 2000); dexBackoffUntil = Date.now() + dexBackoff; throw "429"; }
        if (!r.ok) throw r.status; return r.json();
      }).then(function (pairs) {
        var want = {}, best = {}; chunk.forEach(function (m) { want[m] = 1; });
        (pairs || []).forEach(function (p) {
          var b = p.baseToken && p.baseToken.address, q = ((p.quoteToken && p.quoteToken.symbol) || "").toUpperCase();
          if (!want[b] || !QUOTES[q] || !n(p.priceUsd)) return;
          if (b === WSOL && (q === "SOL" || q === "WSOL")) return;
          var liq = n(p.liquidity && p.liquidity.usd) || 0, vol = n(p.volume && p.volume.h24) || 0;
          if (!best[b] || liq > best[b].liq || (liq === best[b].liq && vol > best[b].vol)) best[b] = { liq: liq, vol: vol, px: n(p.priceUsd) };
        });
        for (var k in best) marks[k] = best[k].px;
        dexBackoff = 0; dexOkAt = Date.now();
      });
    })).catch(function () {});
  }

  function pollHL() {
    return timed(HL, { method: "POST", headers: { "Content-Type": "application/json" }, body: '{"type":"allMids"}' }, 5000)
      .then(function (r) { if (!r.ok) throw r.status; return r.json(); })
      .then(function (m) { if (m && m.SOL) { mids = m; hlOkAt = Date.now(); hlFails = 0; } })
      .catch(function () { hlFails++; });
  }

  function solUsd() {
    var h = n(mids.SOL);
    if (h && Date.now() - hlOkAt < 15000) { solSrc = "HL"; return h; }
    if (marks[WSOL]) { solSrc = "DexScreener"; return marks[WSOL]; }
    solSrc = h ? "HL (stale)" : "snapshot"; return h || (D && D.snapshot && D.snapshot.sol_usd) || null;
  }

  function compute() {
    var sol = solUsd(), r = { sol: sol, coins: [] };
    var P = D.perps, upnlSnap = 0, upnlLive = 0;
    (P.positions || []).forEach(function (p) {
      var m = n(mids[p.coin]); upnlSnap += p.upnl_at_snapshot || 0;
      var u = (m && p.entry) ? p.size * (m - p.entry) * (p.side === "short" ? -1 : 1) : (p.upnl_at_snapshot || 0);
      p._mark = m; p._upnl = u; upnlLive += u;
    });
    r.perps = P.equity - upnlSnap + upnlLive; r.perpsUpnl = upnlLive;
    function val(c, bucket) {
      var m = marks[c.ca], v = m ? c.amount * m : c.cost_sol * (sol || 0), cost = c.cost_sol * (sol || 0);
      r.coins.push({ c: c, bucket: bucket, mark: m, val: v, costUsd: cost, live: !!m }); return v;
    }
    r.pumpCash = (D.pump.cash_sol || 0) * (sol || 0);
    r.pumpCoins = (D.pump.coins || []).reduce(function (a, c) { return a + val(c, "pump"); }, 0);
    r.spot = (D.spot.coins || []).reduce(function (a, c) { return a + val(c, "spot"); }, 0);
    r.total = r.perps + r.pumpCash + r.pumpCoins + r.spot;
    r.paperSol = sol ? (r.pumpCash + r.pumpCoins + r.spot) / sol : null;
    r.pnl = r.total - D.start.total_usd;
    r.inTrades = r.pumpCoins + r.spot + (P.margin_used || 0);
    return r;
  }

  function bucketRow(color, name, sub, value, delta, deltaLbl) {
    return '<div class="bk"><div class="bk-name"><span class="sw" style="background:' + color + '"></span><div><b>' + name + '</b><div class="bk-sub">' + sub + '</div></div></div>' +
      '<div class="bk-val"><b class="num">' + usd(value) + '</b><small class="num ' + cls(delta) + '">' + sgn(delta) + ' ' + deltaLbl + '</small></div></div>';
  }

  function render() {
    if (!D) return;
    var r = compute(), S = D.start;
    var big = $("big");
    if (lastTotal != null && Math.abs(r.total - lastTotal) >= 0.01) {
      big.classList.remove("flash-pos", "flash-neg"); void big.offsetWidth; big.classList.add(r.total > lastTotal ? "flash-pos" : "flash-neg");
    }
    lastTotal = r.total;
    $("total").textContent = usd(r.total);
    $("totalSol").textContent = r.sol ? "≈ " + (r.total / r.sol).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " SOL" : "—";
    $("pnl").textContent = sgn(r.pnl); $("pnl").className = "pnl-big num " + cls(r.pnl);
    $("pnlPct").textContent = pct(r.pnl / S.total_usd * 100); $("pnlPct").className = "pnl-pct num " + cls(r.pnl);
    $("startLbl").textContent = "(" + usd(S.total_usd, 0) + ")";
    $("mSol").textContent = r.sol ? "$" + r.sol.toFixed(2) : "—";
    var btc = n(mids.BTC); $("mBtc").textContent = btc ? usd(btc, 0) : "—";
    $("mBtcSol").textContent = btc && r.sol ? (btc / r.sol).toFixed(1) + " SOL" : "—";
    $("inTrades").textContent = usd(r.inTrades, 0);

    // buckets
    var paperStartUsd = S.paper_usd, paperNowUsd = r.pumpCash + r.pumpCoins + r.spot;
    var parts = [["#60A5FA", r.perps], ["#22C55E", r.pumpCash + r.pumpCoins], ["#A78BFA", r.spot]];
    $("stack").innerHTML = parts.map(function (p) { return '<i style="background:' + p[0] + ';width:' + Math.max(0.6, p[1] / r.total * 100).toFixed(2) + '%"></i>'; }).join("");
    var P = D.perps, nPos = (P.positions || []).length;
    var perpSub = "Co-Invest HL · avail " + usd(P.available, 0) + (nPos ? " · " + nPos + " open · uPnL " + sgn(r.perpsUpnl) : " · no open positions") ;
    var pumpN = (D.pump.coins || []).length, spotN = (D.spot.coins || []).length;
    var pumpSub = "cash " + (D.pump.cash_sol || 0).toFixed(3) + " SOL (" + usd(r.pumpCash) + ") + " + pumpN + " coins " + usd(r.pumpCoins);
    var spotSub = spotN + " coins at live marks · tradepaperapp";
    var pumpCost = (D.pump.coins || []).reduce(function (a, c) { return a + c.cost_sol; }, 0) * r.sol;
    var spotCost = (D.spot.coins || []).reduce(function (a, c) { return a + c.cost_sol; }, 0) * r.sol;
    $("buckets").innerHTML =
      bucketRow("#60A5FA", "Perps", perpSub, r.perps, r.perps - S.perps_usd, "vs $10k start") +
      bucketRow("#22C55E", "Pump.fun", pumpSub, r.pumpCash + r.pumpCoins, r.pumpCoins - pumpCost, "coins vs cost") +
      bucketRow("#A78BFA", "Spot memes", spotSub, r.spot, r.spot - spotCost, "vs cost");
    var paperSolPnl = r.paperSol - S.paper_sol;
    $("bkNote").innerHTML = 'paper SOL acct <span class="' + cls(paperSolPnl) + '">' + (r.paperSol ? r.paperSol.toFixed(2) : "—") + " / " + S.paper_sol + " SOL</span>";

    renderPending(r); renderCoins(r);
    var live = 0; r.coins.forEach(function (c) { if (c.live) live++; });
    var age = function (t) { return t ? Math.round((Date.now() - t) / 1000) + "s" : "—"; };
    $("fresh").textContent = "coins " + live + "/" + r.coins.length + " live · dex " + age(dexOkAt) + (Date.now() < dexBackoffUntil ? " (429 backoff)" : "") + " · SOL via " + solSrc + " " + age(hlOkAt) + " · data " + (D.meta.built_label || "");
    var ok = Date.now() - Math.max(dexOkAt, hlOkAt) < 10000;
    $("dot").className = "dot" + (ok ? "" : " warn");
    $("st").textContent = ok ? "live · 1s" : "reconnecting…";
    $("tick").textContent = hhmmss(Date.now()) + " Paris";
    var hm = function (x) { var t = Date.parse(x); return isFinite(t) && /T/.test(String(x)) ? new Date(t).toLocaleString("en-GB", { timeZone: "Europe/Paris", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : String(x || "—"); };
    $("foot").innerHTML = "PAPER money only · no real funds<br>perps " + esc(hm(D.perps.asof)) + " · pump cash " + esc(hm(D.pump.cash_asof)) + " · spot " + esc(D.spot.asof || "") + " (Paris)" + "<br>snapshot " + esc(D.meta.built_label) + " · start = $10,000 perps + " + S.paper_sol + " SOL @ $" + S.paper_sol_price;
    recordPoint(r.total);
  }

  function renderPending(r) {
    var L = D.pending || [];
    $("pendN").textContent = L.length + " resting";
    if (!L.length) { $("pending").innerHTML = '<div class="empty">no resting orders</div>'; return; }
    $("pending").innerHTML = L.map(function (o) {
      var mark = o.venue === "perps" ? n(mids[o.coin]) : (marks[o.ca] || null);
      var dist = mark && o.limit ? (o.limit / mark - 1) * 100 : null;
      var size = o.venue === "perps" ? (o.size + " " + o.coin + " · " + usd(o.size * o.limit, 0) + " notional" + (o.leverage ? " · " + o.leverage + "x" : "")) : ((o.size_sol || "?") + " SOL");
      var tp = typeof o.tp === "number" ? px(o.tp) : esc(String(o.tp || "—").replace(/^TP\s*/, ""));
      var sl = typeof o.sl === "number" ? px(o.sl) : esc(String(o.sl || "—").replace(/^SL\s*/, ""));
      var stale = o.venue !== "perps" ? '<span class="badge stale">since ' + esc(o.placed_at) + '</span>' : '<span class="badge">#' + o.id + '</span>';
      var fill = dist == null ? 0 : Math.max(0, Math.min(100, 100 - Math.abs(dist) * 20));
      return '<div class="row"><div class="r-top"><span><b>' + esc(o.coin) + '</b> <span class="' + (o.side === "buy" ? "pos" : "neg") + '">' + (o.side === "buy" ? "BUY" : "SELL") + ' LIMIT</span><span class="badge ' + o.venue + '">' + o.venue + '</span>' + stale + '</span>' +
        '<span class="num"><b>' + px(o.limit) + '</b></span></div>' +
        '<div class="r-mid"><span>' + size + '</span><span class="num">mark ' + px(mark) + (dist == null ? "" : ' · <span class="' + (Math.abs(dist) < 0.5 ? "pos" : "") + '">' + pct(dist) + ' to fill</span>') + '</span></div>' +
        '<div class="tpsl num"><span class="pos">TP ' + tp + '</span> · <span class="neg">SL ' + sl + '</span>' + (o.venue === "perps" ? ' <span class="muted">· armed on fill</span>' : '') + '</div>' +
        '<div class="prog"><i style="width:' + fill.toFixed(0) + '%"></i></div></div>';
    }).join("");
  }

  function renderCoins(r) {
    var C = r.coins.slice().sort(function (a, b) { return b.val - a.val; });
    $("holdN").textContent = C.length + " coins · " + usd(r.pumpCoins + r.spot, 0);
    $("coins").innerHTML = C.map(function (x) {
      var d = x.val - x.costUsd, dp = x.costUsd ? d / x.costUsd * 100 : null;
      return '<div class="row"><div class="r-top"><span><b>' + esc(x.c.symbol) + '</b><span class="badge ' + x.bucket + '">' + x.bucket + '</span>' + (x.live ? "" : '<span class="badge stale">no mark · at cost</span>') + '</span><span class="num"><b>' + usd(x.val) + '</b></span></div>' +
        '<div class="r-mid"><span class="num">' + x.c.amount.toLocaleString("en-US") + ' @ ' + px(x.mark) + '</span><span class="num ' + cls(d) + '">' + sgn(d) + ' (' + pct(dp) + ') vs ' + x.c.cost_sol + ' SOL</span></div></div>';
    }).join("");
  }

  // ---- equity curve
  var pts = [];
  try { pts = JSON.parse(localStorage.getItem(LS) || "[]") || []; } catch (e) { pts = []; }
  var lastSave = 0;
  function recordPoint(v) {
    var now = Date.now(), last = pts[pts.length - 1];
    if (last && now - last.t < 5000) return;
    pts.push({ t: now, v: Math.round(v * 100) / 100 });
    if (pts.length > LS_CAP) pts = pts.filter(function (_, i) { return i % 2 === 0 || i > pts.length - 500; });
    if (now - lastSave > 15000) { lastSave = now; try { localStorage.setItem(LS, JSON.stringify(pts)); } catch (e) {} }
    drawCurve();
  }
  function drawCurve() {
    var svg = $("eq"), W = svg.clientWidth || 360, H = svg.clientHeight || 150;
    var hist = (D && D.history || []).map(function (h) { return { t: Date.parse(h.t), v: h.usd }; });
    var series = range === "all" ? hist.concat(pts) : pts.filter(function (p) { return p.t > Date.now() - 6 * 3600e3; });
    series = series.filter(function (p) { return isFinite(p.t) && isFinite(p.v); }).sort(function (a, b) { return a.t - b.t; });
    if (lastTotal != null) series.push({ t: Date.now(), v: lastTotal });
    if (series.length < 2) { svg.innerHTML = '<text x="50%" y="50%" fill="#7C838F" font-size="11" text-anchor="middle">collecting live points…</text>'; return; }
    var t0 = series[0].t, t1 = series[series.length - 1].t, lo = Infinity, hi = -Infinity;
    series.forEach(function (p) { lo = Math.min(lo, p.v); hi = Math.max(hi, p.v); });
    var base = D.start.total_usd, pad = Math.max((hi - lo) * 0.15, 1); lo -= pad; hi += pad;
    var X = function (t) { return (t1 > t0 ? (t - t0) / (t1 - t0) : 1) * (W - 4) + 2; }, Y = function (v) { return H - 4 - (v - lo) / (hi - lo) * (H - 8); };
    var d = series.map(function (p, i) { return (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.v).toFixed(1); }).join(" ");
    var up = series[series.length - 1].v >= series[0].v, col = up ? "#22C55E" : "#F05252";
    var baseLine = base > lo && base < hi ? '<line x1="0" x2="' + W + '" y1="' + Y(base).toFixed(1) + '" y2="' + Y(base).toFixed(1) + '" stroke="#555" stroke-dasharray="3 4" stroke-width="1"/><text x="' + (W - 2) + '" y="' + (Y(base) - 3).toFixed(1) + '" fill="#7C838F" font-size="9" text-anchor="end">start</text>' : "";
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.innerHTML = baseLine + '<path d="' + d + " L" + X(t1).toFixed(1) + " " + H + " L" + X(t0).toFixed(1) + " " + H + ' Z" fill="' + col + '" opacity=".10"/>' +
      '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.6" stroke-linejoin="round"/>';
    var ch = series[series.length - 1].v - series[0].v;
    $("eqMeta").innerHTML = (range === "all" ? "since start" : "this device, last 6h") + " · " + series.length + " pts · <span class='" + cls(ch) + "'>" + sgn(ch) + "</span> · lo " + usd(lo + pad, 0) + " · hi " + usd(hi - pad, 0);
  }
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return; range = b.getAttribute("data-r");
    [].forEach.call(this.children, function (x) { x.classList.toggle("on", x === b); }); drawCurve();
  });

  var busy = false;
  function tick() {
    if (document.hidden || busy || !D) return;
    busy = true;
    Promise.all([pollHL(), pollDex()]).then(function () { busy = false; render(); }, function () { busy = false; });
  }
  loadData().then(tick);
  setInterval(tick, TICK_MS);
  setInterval(loadData, DATA_MS);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { loadData(); tick(); } });
  window.addEventListener("pagehide", function () { try { localStorage.setItem(LS, JSON.stringify(pts)); } catch (e) {} });
})();
</script>
</body>
</html>
